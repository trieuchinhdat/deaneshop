<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <rect width="320" height="180" rx="10" fill="#0f172a"/>
  <rect x="1" y="1" width="318" height="178" rx="9" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Left: Checkout / Delivery Form -->
  <g transform="translate(20, 18)">
    <rect x="0" y="0" width="70" height="8" rx="3" fill="#f8fafc"/>
    <rect x="0" y="12" width="140" height="4" rx="2" fill="#64748b"/>

    <!-- Contact & Shipping Inputs -->
    <rect x="0" y="24" width="146" height="18" rx="4" fill="#1e293b" stroke="#334155"/>
    <rect x="8" y="31" width="45" height="4" rx="2" fill="#64748b"/>

    <rect x="0" y="48" width="146" height="18" rx="4" fill="#1e293b" stroke="#334155"/>
    <rect x="8" y="55" width="60" height="4" rx="2" fill="#64748b"/>

    <rect x="0" y="72" width="70" height="18" rx="4" fill="#1e293b" stroke="#334155"/>
    <rect x="8" y="79" width="30" height="4" rx="2" fill="#64748b"/>

    <rect x="76" y="72" width="70" height="18" rx="4" fill="#1e293b" stroke="#334155"/>
    <rect x="84" y="79" width="30" height="4" rx="2" fill="#64748b"/>

    <!-- Payment Option Selection -->
    <rect x="0" y="98" width="146" height="24" rx="4" fill="#1e293b" stroke="#10b981"/>
    <circle cx="12" cy="110" r="4" fill="#10b981"/>
    <rect x="22" y="108" width="50" height="4" rx="2" fill="#f8fafc"/>
    <rect x="110" y="106" width="28" height="8" rx="2" fill="#334155"/>

    <rect x="0" y="128" width="146" height="18" rx="4" fill="#1e293b" stroke="#334155"/>
    <circle cx="12" cy="137" r="4" fill="#0f172a" stroke="#475569"/>
    <rect x="22" y="135" width="40" height="4" rx="2" fill="#94a3b8"/>
  </g>

  <!-- Right: Order Summary Card -->
  <g transform="translate(182, 18)">
    <rect x="0" y="0" width="118" height="144" rx="8" fill="#1e293b" stroke="#334155"/>
    <rect x="12" y="10" width="60" height="6" rx="2" fill="#f8fafc"/>

    <!-- Item 1 -->
    <rect x="12" y="24" width="22" height="22" rx="4" fill="#0f172a" stroke="#334155"/>
    <rect x="40" y="27" width="45" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="40" y="35" width="20" height="4" rx="2" fill="#64748b"/>
    <rect x="92" y="27" width="16" height="4" rx="2" fill="#f8fafc"/>

    <!-- Item 2 -->
    <rect x="12" y="52" width="22" height="22" rx="4" fill="#0f172a" stroke="#334155"/>
    <rect x="40" y="55" width="40" height="4" rx="2" fill="#cbd5e1"/>
    <rect x="40" y="63" width="18" height="4" rx="2" fill="#64748b"/>
    <rect x="92" y="55" width="16" height="4" rx="2" fill="#f8fafc"/>

    <line x1="12" y1="82" x2="106" y2="82" stroke="#334155" stroke-width="1"/>

    <!-- Total Calculations -->
    <rect x="12" y="90" width="30" height="4" rx="2" fill="#64748b"/>
    <rect x="88" y="90" width="20" height="4" rx="2" fill="#64748b"/>

    <rect x="12" y="99" width="24" height="5" rx="2" fill="#f8fafc"/>
    <rect x="82" y="99" width="26" height="5" rx="2" fill="#10b981"/>

    <!-- Place Order Button -->
    <rect x="12" y="112" width="94" height="22" rx="5" fill="#10b981"/>
    <rect x="36" y="121" width="46" height="4" rx="2" fill="#ffffff"/>
  </g>
</svg>
