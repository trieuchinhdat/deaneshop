<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="cntGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" rx="10" fill="#0f172a"/>
  <rect x="1" y="1" width="318" height="178" rx="9" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Page skeleton behind -->
  <rect x="30" y="16" width="120" height="8" rx="4" fill="#334155"/>
  <rect x="30" y="30" width="260" height="5" rx="2" fill="#1e293b"/>

  <!-- Prominent Urgency Countdown Box -->
  <rect x="16" y="50" width="288" height="80" rx="10" fill="url(#cntGrad)" stroke="#6366f1" stroke-width="1.5"/>

  <!-- Left: Urgency Title & Fire Icon -->
  <circle cx="36" cy="74" r="10" fill="#ef4444" fill-opacity="0.2"/>
  <path d="M36 67 C36 67 39 71 39 74 C39 76 37.5 78 36 78 C34.5 78 33 76 33 74 C33 72 34.5 70 36 67 Z" fill="#ef4444"/>
  <rect x="52" y="68" width="80" height="8" rx="3" fill="#f8fafc"/>
  <rect x="52" y="80" width="60" height="5" rx="2" fill="#94a3b8"/>

  <!-- Center: 4 Digit Boxes (02d : 14h : 36m : 48s) -->
  <g transform="translate(138, 64)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="20" height="24" rx="4" fill="#1e293b" stroke="#475569"/>
    <text x="10" y="16" fill="#f8fafc" font-size="10" font-family="monospace" font-weight="bold" text-anchor="middle">02</text>
    <rect x="3" y="27" width="14" height="3" rx="1" fill="#64748b"/>

    <text x="23" y="15" fill="#a5b4fc" font-size="10" font-weight="bold">:</text>

    <!-- Box 2 -->
    <rect x="27" y="0" width="20" height="24" rx="4" fill="#1e293b" stroke="#475569"/>
    <text x="37" y="16" fill="#f8fafc" font-size="10" font-family="monospace" font-weight="bold" text-anchor="middle">14</text>
    <rect x="30" y="27" width="14" height="3" rx="1" fill="#64748b"/>

    <text x="50" y="15" fill="#a5b4fc" font-size="10" font-weight="bold">:</text>

    <!-- Box 3 -->
    <rect x="54" y="0" width="20" height="24" rx="4" fill="#1e293b" stroke="#475569"/>
    <text x="64" y="16" fill="#f8fafc" font-size="10" font-family="monospace" font-weight="bold" text-anchor="middle">36</text>
    <rect x="57" y="27" width="14" height="3" rx="1" fill="#64748b"/>

    <text x="77" y="15" fill="#a5b4fc" font-size="10" font-weight="bold">:</text>

    <!-- Box 4 -->
    <rect x="81" y="0" width="20" height="24" rx="4" fill="#1e293b" stroke="#10b981"/>
    <text x="91" y="16" fill="#34d399" font-size="10" font-family="monospace" font-weight="bold" text-anchor="middle">48</text>
    <rect x="84" y="27" width="14" height="3" rx="1" fill="#10b981"/>
  </g>

  <!-- Right: CTA Button -->
  <rect x="242" y="104" width="52" height="18" rx="5" fill="#10b981"/>
  <rect x="250" y="111" width="36" height="4" rx="2" fill="#ffffff"/>

  <!-- Page skeleton bottom -->
  <rect x="30" y="145" width="260" height="5" rx="2" fill="#1e293b"/>
  <rect x="30" y="156" width="180" height="5" rx="2" fill="#1e293b"/>
</svg>
