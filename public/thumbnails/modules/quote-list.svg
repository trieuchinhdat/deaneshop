<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <rect width="320" height="180" rx="10" fill="#0f172a"/>
  <rect x="1" y="1" width="318" height="178" rx="9" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Center Header -->
  <rect x="115" y="14" width="90" height="10" rx="5" fill="#10b981" fill-opacity="0.2"/>
  <rect x="130" y="17" width="60" height="4" rx="2" fill="#34d399"/>
  <rect x="90" y="28" width="140" height="8" rx="4" fill="#f8fafc"/>

  <!-- Testimonial Card 1 (Left) -->
  <g transform="translate(20, 46)">
    <rect x="0" y="0" width="134" height="118" rx="8" fill="#1e293b" stroke="#334155"/>
    
    <!-- Stars Row -->
    <circle cx="16" cy="18" r="3" fill="#fbbf24"/>
    <circle cx="25" cy="18" r="3" fill="#fbbf24"/>
    <circle cx="34" cy="18" r="3" fill="#fbbf24"/>
    <circle cx="43" cy="18" r="3" fill="#fbbf24"/>
    <circle cx="52" cy="18" r="3" fill="#fbbf24"/>

    <!-- Quotation Mark -->
    <text x="110" y="28" fill="#334155" font-size="28" font-family="serif" font-weight="bold">“</text>

    <!-- Review Text Skeletons -->
    <rect x="12" y="34" width="110" height="5" rx="2" fill="#e2e8f0"/>
    <rect x="12" y="44" width="100" height="5" rx="2" fill="#94a3b8"/>
    <rect x="12" y="54" width="75" height="5" rx="2" fill="#64748b"/>

    <line x1="12" y1="72" x2="122" y2="72" stroke="#334155" stroke-width="1"/>

    <!-- Reviewer Info -->
    <circle cx="26" cy="94" r="12" fill="#0f172a" stroke="#10b981"/>
    <rect x="46" y="88" width="55" height="5" rx="2" fill="#f8fafc"/>
    <rect x="46" y="96" width="40" height="4" rx="2" fill="#64748b"/>
  </g>

  <!-- Testimonial Card 2 (Right) -->
  <g transform="translate(166, 46)">
    <rect x="0" y="0" width="134" height="118" rx="8" fill="#1e293b" stroke="#334155"/>
    
    <!-- Stars Row -->
    <circle cx="16" cy="18" r="3" fill="#fbbf24"/>
    <circle cx="25" cy="18" r="3" fill="#fbbf24"/>
    <circle cx="34" cy="18" r="3" fill="#fbbf24"/>
    <circle cx="43" cy="18" r="3" fill="#fbbf24"/>
    <circle cx="52" cy="18" r="3" fill="#fbbf24"/>

    <!-- Quotation Mark -->
    <text x="110" y="28" fill="#334155" font-size="28" font-family="serif" font-weight="bold">“</text>

    <!-- Review Text Skeletons -->
    <rect x="12" y="34" width="110" height="5" rx="2" fill="#e2e8f0"/>
    <rect x="12" y="44" width="95" height="5" rx="2" fill="#94a3b8"/>
    <rect x="12" y="54" width="80" height="5" rx="2" fill="#64748b"/>

    <line x1="12" y1="72" x2="122" y2="72" stroke="#334155" stroke-width="1"/>

    <!-- Reviewer Info -->
    <circle cx="26" cy="94" r="12" fill="#0f172a" stroke="#3b82f6"/>
    <rect x="46" y="88" width="50" height="5" rx="2" fill="#f8fafc"/>
    <rect x="46" y="96" width="35" height="4" rx="2" fill="#64748b"/>
  </g>
</svg>
