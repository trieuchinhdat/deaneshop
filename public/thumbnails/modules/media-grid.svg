<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="overlayFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="50%" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect width="320" height="180" rx="10" fill="#0f172a"/>
  <rect x="1" y="1" width="318" height="178" rx="9" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Section Header -->
  <rect x="120" y="12" width="80" height="6" rx="3" fill="#60a5fa" fill-opacity="0.6"/>
  <rect x="100" y="21" width="120" height="9" rx="3" fill="#f8fafc"/>

  <!-- Card 1 -->
  <g transform="translate(16, 38)">
    <rect width="88" height="126" rx="8" fill="url(#cardGrad1)" stroke="#334155"/>
    <!-- Photo element -->
    <circle cx="44" cy="50" r="18" fill="#3b82f6" fill-opacity="0.2"/>
    <path d="M22 80 L38 58 L54 74 L68 52 L82 80 Z" fill="#2563eb" fill-opacity="0.5"/>
    <rect width="88" height="126" rx="8" fill="url(#overlayFade)"/>

    <!-- Badge Tag -->
    <rect x="8" y="8" width="32" height="12" rx="6" fill="#10b981"/>
    <rect x="14" y="12" width="20" height="4" rx="2" fill="#ffffff"/>

    <!-- Top Right Arrow Hover Indicator -->
    <circle cx="74" cy="14" r="7" fill="#ffffff" fill-opacity="0.2"/>
    <path d="M72 16 L76 12 M76 12 L73 12 M76 12 L76 15" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Bottom Text Overlay -->
    <rect x="8" y="94" width="60" height="8" rx="2.5" fill="#f8fafc"/>
    <rect x="8" y="106" width="45" height="5" rx="2" fill="#cbd5e1"/>
  </g>

  <!-- Card 2 (Featured) -->
  <g transform="translate(112, 38)">
    <rect width="88" height="126" rx="8" fill="url(#cardGrad1)" stroke="#10b981" stroke-width="1.5"/>
    <!-- Photo element -->
    <circle cx="44" cy="50" r="18" fill="#10b981" fill-opacity="0.2"/>
    <path d="M22 80 L40 54 L58 72 L70 56 L82 80 Z" fill="#059669" fill-opacity="0.5"/>
    <rect width="88" height="126" rx="8" fill="url(#overlayFade)"/>

    <!-- Badge Tag -->
    <rect x="8" y="8" width="38" height="12" rx="6" fill="#f59e0b"/>
    <rect x="14" y="12" width="26" height="4" rx="2" fill="#ffffff"/>

    <!-- Top Right Arrow Hover Indicator -->
    <circle cx="74" cy="14" r="7" fill="#ffffff" fill-opacity="0.2"/>
    <path d="M72 16 L76 12 M76 12 L73 12 M76 12 L76 15" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Bottom Text Overlay -->
    <rect x="8" y="94" width="65" height="8" rx="2.5" fill="#f8fafc"/>
    <rect x="8" y="106" width="50" height="5" rx="2" fill="#cbd5e1"/>
  </g>

  <!-- Card 3 -->
  <g transform="translate(208, 38)">
    <rect width="88" height="126" rx="8" fill="url(#cardGrad1)" stroke="#334155"/>
    <!-- Photo element -->
    <circle cx="44" cy="50" r="18" fill="#8b5cf6" fill-opacity="0.2"/>
    <path d="M22 80 L38 60 L52 74 L66 54 L82 80 Z" fill="#7c3aed" fill-opacity="0.5"/>
    <rect width="88" height="126" rx="8" fill="url(#overlayFade)"/>

    <!-- Top Right Arrow Hover Indicator -->
    <circle cx="74" cy="14" r="7" fill="#ffffff" fill-opacity="0.2"/>
    <path d="M72 16 L76 12 M76 12 L73 12 M76 12 L76 15" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Bottom Text Overlay -->
    <rect x="8" y="94" width="58" height="8" rx="2.5" fill="#f8fafc"/>
    <rect x="8" y="106" width="40" height="5" rx="2" fill="#cbd5e1"/>
  </g>

  <!-- Mobile Peeking Card 4 (Right Edge Peek) -->
  <g transform="translate(304, 38)">
    <rect width="20" height="126" rx="4" fill="url(#cardGrad1)" stroke="#334155"/>
    <rect width="20" height="126" rx="4" fill="url(#overlayFade)"/>
  </g>
</svg>
