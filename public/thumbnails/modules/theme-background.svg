  <rect x="36" y="120" width="45" height="18" rx="5" fill="#10b981"/>

  <!-- Right: Theme Setting Controls -->
  <g transform="translate(176, 22)">
    <rect x="0" y="0" width="75" height="8" rx="3" fill="#f8fafc"/>
    <rect x="0" y="14" width="110" height="4" rx="2" fill="#64748b"/>

    <!-- Radio Style Options -->
    <rect x="0" y="28" width="58" height="16" rx="4" fill="#1e293b" stroke="#3b82f6"/>
    <circle cx="10" cy="36" r="3" fill="#3b82f6"/>
    <rect x="18" y="34" width="32" height="4" rx="2" fill="#f8fafc"/>

    <rect x="64" y="28" width="58" height="16" rx="4" fill="#1e293b" stroke="#334155"/>
    <circle cx="74" cy="36" r="3" fill="#334155"/>
    <rect x="82" y="34" width="32" height="4" rx="2" fill="#94a3b8"/>

    <!-- Color Swatches Row -->
    <rect x="0" y="56" width="65" height="6" rx="2" fill="#94a3b8"/>
    <circle cx="8" cy="74" r="8" fill="#0f172a" stroke="#3b82f6" stroke-width="2"/>
    <circle cx="28" cy="74" r="8" fill="#1e293b" stroke="#334155"/>
    <circle cx="48" cy="74" r="8" fill="#047857" stroke="#334155"/>
    <circle cx="68" cy="74" r="8" fill="#1d4ed8" stroke="#334155"/>
    <circle cx="88" cy="74" r="8" fill="#6d28d9" stroke="#334155"/>
    <circle cx="108" cy="74" r="8" fill="#f8fafc" stroke="#334155"/>

