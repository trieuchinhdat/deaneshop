<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <rect width="320" height="180" rx="10" fill="#0f172a"/>
  <rect x="1" y="1" width="318" height="178" rx="9" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Code Editor Window Frame -->
  <g transform="translate(24, 18)">
    <rect x="0" y="0" width="272" height="144" rx="8" fill="#020617" stroke="#334155" stroke-width="1.5"/>

    <!-- Window Top Header Bar -->
    <rect x="0" y="0" width="272" height="24" rx="8" fill="#1e293b"/>
    <!-- Round macOS Buttons -->
    <circle cx="16" cy="12" r="4" fill="#ef4444"/>
    <circle cx="28" cy="12" r="4" fill="#f59e0b"/>
    <circle cx="40" cy="12" r="4" fill="#10b981"/>

    <!-- Code File / Label -->
    <text x="136" y="15" fill="#94a3b8" font-size="9" font-family="monospace" text-anchor="middle">&lt;/&gt; custom-embed.html</text>

    <!-- Code Syntax Highlighted Lines -->
    <!-- Line 1: <div class="custom-block"> -->
    <text x="16" y="44" fill="#475569" font-size="9" font-family="monospace">1</text>
    <rect x="32" y="36" width="32" height="8" rx="2" fill="#60a5fa"/>
    <rect x="68" y="36" width="40" height="8" rx="2" fill="#a78bfa"/>
    <rect x="112" y="36" width="55" height="8" rx="2" fill="#34d399"/>

    <!-- Line 2:   <h2 style="...">Title</h2> -->
    <text x="16" y="62" fill="#475569" font-size="9" font-family="monospace">2</text>
    <rect x="44" y="54" width="24" height="8" rx="2" fill="#60a5fa"/>
    <rect x="72" y="54" width="30" height="8" rx="2" fill="#a78bfa"/>
    <rect x="106" y="54" width="60" height="8" rx="2" fill="#f8fafc"/>
    <rect x="170" y="54" width="28" height="8" rx="2" fill="#60a5fa"/>

    <!-- Line 3:   <script async src="..."></script> -->
    <text x="16" y="80" fill="#475569" font-size="9" font-family="monospace">3</text>
    <rect x="44" y="72" width="36" height="8" rx="2" fill="#f59e0b"/>
    <rect x="84" y="72" width="26" height="8" rx="2" fill="#a78bfa"/>
    <rect x="114" y="72" width="75" height="8" rx="2" fill="#34d399"/>
    <rect x="193" y="72" width="40" height="8" rx="2" fill="#f59e0b"/>

    <!-- Line 4: </div> -->
    <text x="16" y="98" fill="#475569" font-size="9" font-family="monospace">4</text>
    <rect x="32" y="90" width="36" height="8" rx="2" fill="#60a5fa"/>

    <!-- Bottom Status Bar -->
    <line x1="0" y1="120" x2="272" y2="120" stroke="#1e293b" stroke-width="1"/>
    <rect x="14" y="128" width="50" height="5" rx="2" fill="#10b981"/>
    <rect x="220" y="128" width="38" height="5" rx="2" fill="#64748b"/>
  </g>
</svg>
