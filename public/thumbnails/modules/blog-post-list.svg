<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <rect width="320" height="180" rx="10" fill="#0f172a"/>
  <rect x="1" y="1" width="318" height="178" rx="9" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="20" y="18" width="85" height="10" rx="4" fill="#f8fafc"/>
  <rect x="20" y="32" width="60" height="4" rx="2" fill="#64748b"/>
  <rect x="250" y="20" width="50" height="8" rx="4" fill="#3b82f6" fill-opacity="0.2"/>
  <rect x="258" y="23" width="34" height="3" rx="1.5" fill="#60a5fa"/>

  <!-- 3 Article Cards -->
  <!-- Card 1 -->
  <g transform="translate(20, 46)">
    <rect x="0" y="0" width="86" height="118" rx="8" fill="#1e293b" stroke="#334155"/>
    <rect x="4" y="4" width="78" height="46" rx="5" fill="#0f172a"/>
    <circle cx="43" cy="27" r="10" fill="#334155" fill-opacity="0.5"/>
    <!-- Category Pill -->
    <rect x="8" y="8" width="28" height="7" rx="3.5" fill="#3b82f6"/>
    <!-- Date -->
    <rect x="8" y="56" width="38" height="3" rx="1.5" fill="#64748b"/>
    <!-- Title -->
    <rect x="8" y="64" width="70" height="6" rx="2" fill="#f8fafc"/>
    <rect x="8" y="73" width="55" height="6" rx="2" fill="#e2e8f0"/>
    <!-- Excerpt -->
    <rect x="8" y="85" width="68" height="4" rx="2" fill="#94a3b8"/>
    <rect x="8" y="92" width="48" height="4" rx="2" fill="#64748b"/>
    <!-- Read Link -->
    <rect x="8" y="104" width="36" height="3" rx="1.5" fill="#60a5fa"/>
  </g>

  <!-- Card 2 -->
  <g transform="translate(117, 46)">
    <rect x="0" y="0" width="86" height="118" rx="8" fill="#1e293b" stroke="#334155"/>
    <rect x="4" y="4" width="78" height="46" rx="5" fill="#0f172a"/>
    <circle cx="43" cy="27" r="10" fill="#334155" fill-opacity="0.5"/>
    <!-- Category Pill -->
    <rect x="8" y="8" width="32" height="7" rx="3.5" fill="#10b981"/>
    <!-- Date -->
    <rect x="8" y="56" width="38" height="3" rx="1.5" fill="#64748b"/>
    <!-- Title -->
    <rect x="8" y="64" width="70" height="6" rx="2" fill="#f8fafc"/>
    <rect x="8" y="73" width="55" height="6" rx="2" fill="#e2e8f0"/>
    <!-- Excerpt -->
    <rect x="8" y="85" width="68" height="4" rx="2" fill="#94a3b8"/>
    <rect x="8" y="92" width="48" height="4" rx="2" fill="#64748b"/>
    <!-- Read Link -->
    <rect x="8" y="104" width="36" height="3" rx="1.5" fill="#34d399"/>
  </g>

  <!-- Card 3 -->
  <g transform="translate(214, 46)">
    <rect x="0" y="0" width="86" height="118" rx="8" fill="#1e293b" stroke="#334155"/>
    <rect x="4" y="4" width="78" height="46" rx="5" fill="#0f172a"/>
    <circle cx="43" cy="27" r="10" fill="#334155" fill-opacity="0.5"/>
    <!-- Category Pill -->
    <rect x="8" y="8" width="30" height="7" rx="3.5" fill="#8b5cf6"/>
    <!-- Date -->
    <rect x="8" y="56" width="38" height="3" rx="1.5" fill="#64748b"/>
    <!-- Title -->
    <rect x="8" y="64" width="70" height="6" rx="2" fill="#f8fafc"/>
    <rect x="8" y="73" width="55" height="6" rx="2" fill="#e2e8f0"/>
    <!-- Excerpt -->
    <rect x="8" y="85" width="68" height="4" rx="2" fill="#94a3b8"/>
    <rect x="8" y="92" width="48" height="4" rx="2" fill="#64748b"/>
    <!-- Read Link -->
