    <rect x="62" y="18" width="54" height="10" rx="5" fill="#3b82f6" fill-opacity="0.2"/>
    <rect x="70" y="21" width="38" height="4" rx="2" fill="#60a5fa"/>

    <!-- Title Skeleton -->
