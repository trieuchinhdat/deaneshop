<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="mediaSlideGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect width="320" height="180" rx="10" fill="#0f172a"/>
  <rect x="1" y="1" width="318" height="178" rx="9" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Left Peeking Slide -->
  <g transform="translate(-50, 24)">
    <rect width="90" height="124" rx="8" fill="url(#mediaSlideGrad)" stroke="#334155"/>
    <circle cx="50" cy="60" r="14" fill="#334155" fill-opacity="0.4"/>
  </g>

  <!-- Center Active Slide (Lookbook / Visual Banner) -->
  <g transform="translate(56, 20)">
    <rect width="208" height="132" rx="10" fill="url(#mediaSlideGrad)" stroke="#64748b" stroke-width="1.5"/>
    <!-- Photo Graphic -->
    <circle cx="160" cy="56" r="22" fill="#3b82f6" fill-opacity="0.15"/>
    <circle cx="160" cy="56" r="10" fill="#f59e0b" fill-opacity="0.6"/>
    <!-- Scenic mountains -->
    <path d="M40 108 L90 56 L130 92 L160 66 L200 108 Z" fill="#3b82f6" fill-opacity="0.35"/>
    <path d="M10 114 L50 78 L90 114 Z" fill="#10b981" fill-opacity="0.3"/>

    <!-- Subtle Clean Caption Overlay -->
    <rect x="16" y="94" width="70" height="7" rx="3" fill="#f8fafc"/>
    <rect x="16" y="105" width="45" height="4" rx="2" fill="#94a3b8"/>
  </g>

  <!-- Right Peeking Slide -->
  <g transform="translate(280, 24)">
    <rect width="90" height="124" rx="8" fill="url(#mediaSlideGrad)" stroke="#334155"/>
    <circle cx="30" cy="60" r="14" fill="#334155" fill-opacity="0.4"/>
  </g>

  <!-- Left Arrow -->
  <circle cx="44" cy="86" r="12" fill="#0f172a" fill-opacity="0.8" stroke="#475569" stroke-width="1.2"/>
  <path d="M46 81 L41 86 L46 91" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Right Arrow -->
  <circle cx="276" cy="86" r="12" fill="#0f172a" fill-opacity="0.8" stroke="#475569" stroke-width="1.2"/>
  <path d="M274 81 L279 86 L274 91" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Bottom Pagination Dots -->
  <g transform="translate(142, 160)">
    <circle cx="0" cy="2" r="2.5" fill="#475569"/>
    <rect x="10" y="0" width="16" height="4" rx="2" fill="#38bdf8"/>
    <circle cx="36" cy="2" r="2.5" fill="#475569"/>
  </g>
</svg>
