<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="heroBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="heroDarkFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="40%" stop-color="#000000" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Container Base -->
  <rect width="320" height="180" rx="10" fill="#0f172a"/>
  <rect x="1" y="1" width="318" height="178" rx="9" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Full-Bleed Hero Slide Banner -->
  <rect x="12" y="12" width="296" height="156" rx="8" fill="url(#heroBgGrad)"/>

  <!-- Simulated Photographic Graphic in Background -->
  <circle cx="240" cy="54" r="28" fill="#10b981" fill-opacity="0.15"/>
  <circle cx="240" cy="54" r="16" fill="#34d399" fill-opacity="0.2"/>
  <path d="M190 120 L230 75 L260 105 L285 78 L308 120 Z" fill="#065f46" fill-opacity="0.4"/>
  <path d="M160 135 L205 90 L245 135 Z" fill="#047857" fill-opacity="0.3"/>

  <!-- Dark Bottom Gradient for WCAG Contrast -->
  <rect x="12" y="12" width="296" height="156" rx="8" fill="url(#heroDarkFade)"/>
  <rect x="12" y="12" width="296" height="156" rx="8" fill="none" stroke="#475569" stroke-width="1.5"/>

  <!-- Left Arrow Pill -->
  <circle cx="28" cy="90" r="11" fill="#000000" fill-opacity="0.5" stroke="#475569" stroke-width="1"/>
  <path d="M30 85 L25 90 L30 95" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Right Arrow Pill -->
  <circle cx="292" cy="90" r="11" fill="#000000" fill-opacity="0.5" stroke="#475569" stroke-width="1"/>
  <path d="M290 85 L295 90 L290 95" stroke="#f8fafc" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Thumb Zone Content (Anchored Bottom-Left) -->
  <g transform="translate(44, 48)">
    <!-- Eyebrow Pill Tag -->
    <rect x="0" y="0" width="86" height="14" rx="7" fill="#10b981" fill-opacity="0.25" stroke="#10b981" stroke-width="0.8"/>
    <rect x="12" y="5" width="62" height="4" rx="2" fill="#34d399"/>

    <!-- Main Headline H1 (Bold Multi-line) -->
    <rect x="0" y="20" width="150" height="13" rx="3.5" fill="#f8fafc"/>
    <rect x="0" y="37" width="115" height="13" rx="3.5" fill="#f8fafc"/>

    <!-- Supporting Pitch / Subtitle -->
    <rect x="0" y="56" width="140" height="5" rx="2" fill="#cbd5e1"/>
    <rect x="0" y="65" width="105" height="5" rx="2" fill="#94a3b8"/>

    <!-- Conversion Dual CTAs (Primary + Secondary) -->
    <rect x="0" y="78" width="68" height="22" rx="6" fill="#10b981"/>
    <rect x="14" y="87" width="40" height="4" rx="2" fill="#ffffff"/>

    <rect x="76" y="78" width="64" height="22" rx="6" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4"/>
    <rect x="90" y="87" width="36" height="4" rx="2" fill="#f8fafc"/>
  </g>

  <!-- Bottom Indicator Dots / Progress Bar -->
  <g transform="translate(136, 154)">
    <rect x="0" y="0" width="20" height="4" rx="2" fill="#10b981"/>
    <circle cx="28" cy="2" r="2.5" fill="#ffffff" fill-opacity="0.4"/>
    <circle cx="38" cy="2" r="2.5" fill="#ffffff" fill-opacity="0.4"/>
    <circle cx="48" cy="2" r="2.5" fill="#ffffff" fill-opacity="0.4"/>
  </g>
</svg>
