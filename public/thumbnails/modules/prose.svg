<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <rect width="320" height="180" rx="10" fill="#0f172a"/>
  <rect x="1" y="1" width="318" height="178" rx="9" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Centered Article Container -->
  <g transform="translate(48, 18)">
    <!-- Article Title (H1) -->
    <rect x="0" y="0" width="160" height="12" rx="3" fill="#f8fafc"/>
    <rect x="0" y="16" width="224" height="6" rx="2" fill="#64748b"/>

    <!-- Section Heading (H2) -->
    <rect x="0" y="32" width="100" height="9" rx="2" fill="#e2e8f0"/>

    <!-- Paragraph 1 -->
    <rect x="0" y="47" width="224" height="4" rx="2" fill="#94a3b8"/>
    <rect x="0" y="55" width="224" height="4" rx="2" fill="#94a3b8"/>
    <rect x="0" y="63" width="210" height="4" rx="2" fill="#94a3b8"/>
    <rect x="0" y="71" width="160" height="4" rx="2" fill="#94a3b8"/>

    <!-- Inset Blockquote Line -->
    <rect x="0" y="83" width="3" height="26" rx="1.5" fill="#3b82f6"/>
    <rect x="12" y="86" width="200" height="5" rx="2" fill="#cbd5e1"/>
    <rect x="12" y="95" width="140" height="5" rx="2" fill="#cbd5e1"/>

    <!-- Paragraph 2 -->
    <rect x="0" y="117" width="224" height="4" rx="2" fill="#94a3b8"/>
    <rect x="0" y="125" width="224" height="4" rx="2" fill="#94a3b8"/>
    <rect x="0" y="133" width="180" height="4" rx="2" fill="#94a3b8"/>
  </g>
</svg>
