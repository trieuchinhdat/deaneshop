<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <rect width="320" height="180" rx="10" fill="#0f172a"/>
  <rect x="1" y="1" width="318" height="178" rx="9" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Left: Gallery Media -->
  <!-- Main Image Box -->
  <rect x="20" y="20" width="124" height="98" rx="8" fill="#1e293b" stroke="#334155"/>
  <circle cx="82" cy="62" r="18" fill="#334155" fill-opacity="0.6"/>
  <path d="M72 70 L79 60 L85 67 L92 56 L100 70 Z" fill="#60a5fa"/>
  <circle cx="91" cy="58" r="3" fill="#fbbf24"/>

  <!-- 3 Mini Thumbnails -->
  <rect x="20" y="126" width="36" height="34" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <rect x="64" y="126" width="36" height="34" rx="6" fill="#1e293b" stroke="#334155"/>
  <rect x="108" y="126" width="36" height="34" rx="6" fill="#1e293b" stroke="#334155"/>

  <!-- Right: Buy Box / Product Details -->
  <!-- Category Badge -->
  <rect x="160" y="22" width="48" height="8" rx="4" fill="#3b82f6" fill-opacity="0.2"/>
  <rect x="168" y="24" width="32" height="4" rx="2" fill="#60a5fa"/>

  <!-- Product Title -->
  <rect x="160" y="36" width="130" height="12" rx="3" fill="#f8fafc"/>
  <rect x="160" y="52" width="90" height="10" rx="3" fill="#e2e8f0"/>

  <!-- Star Rating Row -->
  <g transform="translate(160, 68)">
    <circle cx="4" cy="4" r="3" fill="#fbbf24"/>
    <circle cx="14" cy="4" r="3" fill="#fbbf24"/>
    <circle cx="24" cy="4" r="3" fill="#fbbf24"/>
    <circle cx="34" cy="4" r="3" fill="#fbbf24"/>
    <circle cx="44" cy="4" r="3" fill="#fbbf24"/>
    <rect x="54" y="2" width="40" height="4" rx="2" fill="#64748b"/>
  </g>

  <!-- Price Block -->
  <rect x="160" y="82" width="55" height="14" rx="3" fill="#f8fafc"/>
  <rect x="222" y="84" width="34" height="10" rx="5" fill="#10b981" fill-opacity="0.2"/>
  <rect x="228" y="87" width="22" height="4" rx="2" fill="#34d399"/>

  <!-- Variants Pills (Options) -->
  <rect x="160" y="104" width="28" height="16" rx="4" fill="#0f172a" stroke="#10b981"/>
  <rect x="194" y="104" width="28" height="16" rx="4" fill="#1e293b" stroke="#334155"/>
  <rect x="228" y="104" width="28" height="16" rx="4" fill="#1e293b" stroke="#334155"/>

  <!-- Add to Cart CTA Button -->
  <rect x="160" y="128" width="138" height="28" rx="6" fill="#10b981"/>
  <circle cx="180" cy="142" r="5" fill="#ffffff" fill-opacity="0.3"/>
  <rect x="194" y="139" width="70" height="6" rx="3" fill="#ffffff"/>
</svg>
