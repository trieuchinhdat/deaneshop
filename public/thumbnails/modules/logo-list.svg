<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <rect width="320" height="180" rx="10" fill="#0f172a"/>
  <rect x="1" y="1" width="318" height="178" rx="9" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Centered Title -->
  <rect x="100" y="32" width="120" height="10" rx="5" fill="#334155" fill-opacity="0.6"/>
  <rect x="115" y="35" width="90" height="4" rx="2" fill="#94a3b8"/>

  <!-- Logo Row Container Card -->
  <rect x="16" y="58" width="288" height="64" rx="10" fill="#1e293b" stroke="#334155"/>

  <!-- Logo 1 (Hexagon + Text) -->
  <g transform="translate(28, 76)">
    <polygon points="14,0 24,6 24,18 14,24 4,18 4,6" fill="none" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="14" cy="12" r="3" fill="#60a5fa"/>
    <rect x="32" y="9" width="18" height="6" rx="2" fill="#94a3b8"/>
  </g>

  <!-- Logo 2 (Diamond + Text) -->
  <g transform="translate(86, 76)">
    <polygon points="14,1 25,12 14,23 3,12" fill="none" stroke="#10b981" stroke-width="2"/>
    <circle cx="14" cy="12" r="3" fill="#10b981"/>
    <rect x="32" y="9" width="18" height="6" rx="2" fill="#94a3b8"/>
  </g>

  <!-- Logo 3 (Shield + Text) -->
  <g transform="translate(144, 76)">
    <path d="M4 4 L24 4 L24 14 C24 20 14 24 14 24 C14 24 4 20 4 14 Z" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="32" y="9" width="18" height="6" rx="2" fill="#94a3b8"/>
  </g>

  <!-- Logo 4 (Circle Cross + Text) -->
  <g transform="translate(202, 76)">
    <circle cx="14" cy="12" r="10" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <line x1="8" y1="12" x2="20" y2="12" stroke="#f59e0b" stroke-width="2"/>
    <line x1="14" y1="6" x2="14" y2="18" stroke="#f59e0b" stroke-width="2"/>
    <rect x="32" y="9" width="18" height="6" rx="2" fill="#94a3b8"/>
  </g>

  <!-- Logo 5 (Triangle + Text) -->
  <g transform="translate(260, 76)">
    <polygon points="14,2 24,22 4,22" fill="none" stroke="#ec4899" stroke-width="2"/>
    <circle cx="14" cy="15" r="2.5" fill="#ec4899"/>
  </g>

  <!-- Subtitle Bar Below -->
  <rect x="125" y="140" width="70" height="4" rx="2" fill="#475569"/>
</svg>
