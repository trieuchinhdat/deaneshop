<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradPreview" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
  </defs>
  <rect width="320" height="180" rx="10" fill="#0f172a"/>
  <rect x="1" y="1" width="318" height="178" rx="9" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Left: Background Preview Canvas -->
  <rect x="20" y="20" width="140" height="140" rx="10" fill="url(#bgGradPreview)" stroke="#475569" stroke-width="1.5"/>
  <rect x="36" y="36" width="60" height="8" rx="3" fill="#ffffff" fill-opacity="0.8"/>
  <rect x="36" y="50" width="90" height="5" rx="2" fill="#ffffff" fill-opacity="0.5"/>
