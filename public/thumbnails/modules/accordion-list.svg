<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <rect width="320" height="180" rx="10" fill="#0f172a"/>
  <rect x="1" y="1" width="318" height="178" rx="9" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Center Header -->
  <rect x="110" y="14" width="100" height="10" rx="5" fill="#3b82f6" fill-opacity="0.2"/>
  <rect x="125" y="17" width="70" height="4" rx="2" fill="#60a5fa"/>
  <rect x="80" y="27" width="160" height="8" rx="4" fill="#f8fafc"/>

  <!-- Item 1 (Expanded with Answer) -->
  <g transform="translate(24, 42)">
    <rect x="0" y="0" width="272" height="64" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <!-- Question bar -->
    <rect x="14" y="12" width="150" height="7" rx="3" fill="#f8fafc"/>
    <!-- Chevron Up -->
    <path d="M250 17 L254 13 L258 17" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <line x1="14" y1="28" x2="258" y2="28" stroke="#334155" stroke-width="1"/>
    <!-- Answer text -->
    <rect x="14" y="36" width="240" height="5" rx="2" fill="#94a3b8"/>
    <rect x="14" y="46" width="200" height="5" rx="2" fill="#64748b"/>
  </g>

  <!-- Item 2 (Collapsed) -->
  <g transform="translate(24, 112)">
    <rect x="0" y="0" width="272" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
    <rect x="14" y="10" width="170" height="6" rx="3" fill="#e2e8f0"/>
    <!-- Chevron Down -->
    <path d="M250 11 L254 15 L258 11" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Item 3 (Collapsed) -->
  <g transform="translate(24, 144)">
    <rect x="0" y="0" width="272" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
    <rect x="14" y="10" width="140" height="6" rx="3" fill="#e2e8f0"/>
    <!-- Chevron Down -->
    <path d="M250 11 L254 15 L258 11" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
