    <rect x="0" y="0" width="272" height="84" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <!-- Left Accent Stripe -->
    <path d="M0 8 C0 3.58 3.58 0 8 0 L8 0 L8 84 L8 84 C3.58 84 0 80.42 0 76 Z" fill="#3b82f6"/>

    <!-- Info / Alert Icon Circle -->
